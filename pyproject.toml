[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-dispatch"
version = "2.0.0"
description = "Market Dispatch — Automated financial news metadata aggregator for Bloomberg, Reuters, and WSJ."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "feedparser>=6.0.11",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.0",
  "jinja2>=3.1.4",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1.0"]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "live: tests hitting live external RSS/translation endpoints",
]
