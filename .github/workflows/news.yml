name: Market Dispatch 定时抓取与发布

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-dispatch-generated
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出主干代码（main）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装运行依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 恢复 generated 分支既有数据库与归档页面
        run: |
          mkdir -p _site data daily archive
          if git ls-remote --exit-code --heads origin generated >/dev/null 2>&1; then
            git fetch origin generated:generated
            git worktree add _site generated
            [ -f _site/data/news.db ] && cp _site/data/news.db data/news.db
            [ -d _site/daily ] && cp -r _site/daily/. daily/ || true
            [ -d _site/archive ] && cp -r _site/archive/. archive/ || true
          else
            git worktree add --detach _site
            (cd _site && git checkout --orphan generated && git rm -rf --quiet .)
          fi

      - name: 初始化数据库并执行抓取渲染流水线
        env:
          MD_TRANSLATOR_ENGINE: ${{ vars.MD_TRANSLATOR_ENGINE || 'google' }}
          MD_LLM_API_BASE: ${{ vars.MD_LLM_API_BASE || '' }}
          MD_LLM_MODEL: ${{ vars.MD_LLM_MODEL || '' }}
          MD_LLM_API_KEY: ${{ secrets.MD_LLM_API_KEY || '' }}
        run: |
          python -m src.main init-db
          python -m src.main run
          python -m src.main status

      - name: 同步产物并提交推送至 generated 分支
        run: |
          mkdir -p _site/data _site/daily _site/archive
          cp data/news.db _site/data/news.db
          cp index.html _site/index.html
          rm -rf _site/daily/*
          cp -r daily/. _site/daily/ || true
          cp -r archive/. _site/archive/ || true
          touch _site/.nojekyll

          cd _site
          git config user.name "market-dispatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.db index.html daily archive .nojekyll
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交。"
          else
            NOW_CN=$(TZ="Asia/Shanghai" date "+%Y-%m-%d %H:%M")
            git commit -m "自动更新：${NOW_CN} 财经简报与数据 [skip ci]"
            git push origin generated
          fi
